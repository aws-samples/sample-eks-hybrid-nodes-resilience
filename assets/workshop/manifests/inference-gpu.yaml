# =============================================================================
# GPU INFERENCE (cloud burst tier) - Module 6.3
#
# A separate deployment (not a variant of `inference`): bigger model
# (llama3.1:8b), GPU required. The nvidia.com/gpu resource limit is what
# routes it to the gpu-burst NodePool; the toleration accepts that NodePool's
# taint. No node exists for it until this is applied - Karpenter creates one.
#
# Deliberately NO disconnect tolerations: this tier IS the cloud. It is
# engineered to be elastic and disposable, not to survive a WAN outage -
# that contrast with the baseline tier is the design insight of the module.
#
# ${INFERENCE_REGISTRY} resolved at provisioning: your account's ECR (images built there by CodeBuild).
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gpu
  namespace: default
  labels: {app: inference-gpu, tier: cloud-burst}
spec:
  replicas: 1
  selector:
    matchLabels: {app: inference-gpu}
  template:
    metadata:
      labels: {app: inference-gpu}
    spec:
      # Pin to the GPU NodePool explicitly. The nvidia.com/gpu limit alone is
      # enough for Karpenter to pick the right pool, but it still EVALUATES the
      # CPU pools and logs a "no instance type has enough resources" error for
      # each one - three screens of noise that bury the single error a
      # participant needs to read. Naming the pool makes the intent explicit and
      # the logs legible (observed on event 66489015).
      nodeSelector:
        karpenter.sh/nodepool: gpu-burst
      tolerations:
        - key: nvidia.com/gpu        # accepts the GPU node's taint
          operator: Exists
      containers:
        - name: ollama
          image: ${INFERENCE_REGISTRY}/ollama-llama31-8b:latest   # 8B model baked in
          imagePullPolicy: IfNotPresent
          env:
            - {name: OLLAMA_NUM_PARALLEL, value: "4"}
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}
          ports:
            - {containerPort: 11434, name: ollama}
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              nvidia.com/gpu: "1"    # triggers the gpu-burst NodePool
          readinessProbe:
            httpGet: {path: /, port: 11434}
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gpu
  namespace: default
  labels: {app: inference-gpu}
spec:
  selector: {app: inference-gpu}
  ports:
    - {name: http, port: 80, targetPort: 11434}
