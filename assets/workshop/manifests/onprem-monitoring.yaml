# =============================================================================
# ON-PREMISES MONITORING STACK - Module 5.1
#
# Everything runs ON the hybrid nodes, tolerates disconnection, and is
# reachable from the DC network. Components:
#   - Blackbox Exporter : probes the CLOUD from on-prem (the inverted direction)
#   - Prometheus        : local scrape + remote_write to AMP when connected
#   - node-exporter     : DaemonSet, hybrid nodes only
#   - kube-state-metrics: local copy (its watch cache keeps serving during
#                         a disconnection - the cloud-side add-on goes dark)
#   - Grafana           : the storm console, MetalLB VIP 10.80.1.241,
#                         hybrid-nodes dashboard pre-provisioned as home
#
# Substituted at provisioning by the asset install step:
#   EKS_ENDPOINT          cluster API endpoint (blackbox target)
#   CLOUD_NODE_TARGETS    cloud node InternalIPs (ICMP probes), YAML list items
#   AMP_REMOTE_WRITE_URL  AMP remote write URL
#   AWS_REGION            region for sigv4
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: onprem-monitoring
  labels: {workshop: eks-hybrid-nodes}
---
# ------------------------------------------------------------ Blackbox Exporter
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: onprem-monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          # the EKS endpoint answers 403 to unauthenticated requests - that still
          # proves the DC can REACH it, which is the question being asked
          valid_status_codes: [200, 401, 403]
          # The certificate is verified: the EKS endpoint chains to the cluster
          # CA, which every pod gets mounted with its service account token.
          tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
      icmp:
        prober: icmp
        timeout: 3s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: onprem-monitoring
  labels: {app: blackbox-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: blackbox-exporter}
  template:
    metadata:
      labels: {app: blackbox-exporter}
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute}
      containers:
        - name: blackbox
          image: quay.io/prometheus/blackbox-exporter:v0.25.0
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports:
            - {containerPort: 9115, name: http}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
          securityContext:
            capabilities:
              add: [NET_RAW]    # ICMP probes
          volumeMounts:
            - {name: cfg, mountPath: /etc/blackbox}
      volumes:
        - name: cfg
          configMap: {name: blackbox-config}
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: onprem-monitoring
spec:
  selector: {app: blackbox-exporter}
  ports:
    - {name: http, port: 9115, targetPort: 9115}
---
# node-exporter: NOT deployed here on purpose. The cluster already runs the
# prometheus-node-exporter EKS ADD-ON as a DaemonSet holding hostPort 9100 on
# every node, hybrid included - a second one stays Pending forever with
# "didn't have free ports for the requested pod ports" (v5 e2e 2026-08-06).
# The hybrid-nodes scrape job below targets node:9100 and picks up the add-on.
# ------------------------------------------------------------ kube-state-metrics (local copy)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: onprem-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: onprem-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets, statefulsets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: onprem-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: onprem-kube-state-metrics
subjects:
  - {kind: ServiceAccount, name: kube-state-metrics, namespace: onprem-monitoring}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: onprem-monitoring
  labels: {app: kube-state-metrics}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-state-metrics}
  template:
    metadata:
      labels: {app: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args: ["--resources=pods,nodes,deployments,daemonsets"]
          ports:
            - {containerPort: 8080, name: metrics}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: onprem-monitoring
spec:
  selector: {app: kube-state-metrics}
  ports:
    - {name: metrics, port: 8080, targetPort: 8080}
---
# ------------------------------------------------------------ Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: onprem-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: onprem-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: onprem-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: onprem-prometheus
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: onprem-monitoring}
---
# Gateway metrics (port 10080) are read THROUGH the API server proxy, not
# directly. A pod on a hybrid node gets no answer from the gateway node on
# 10080: the request reaches it over the VPN, but the gateway sends the reply
# for the on-prem pod CIDR back through its VXLAN tunnel (measured on the E2E
# 2026-09-28: pod -> gateway timed out, hybrid host -> gateway answered). The
# API server path works, and needs only pods/proxy in the gateway namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: onprem-prometheus-gateway-proxy
  namespace: eks-hybrid-nodes-gateway
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: onprem-prometheus-gateway-proxy
  namespace: eks-hybrid-nodes-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: onprem-prometheus-gateway-proxy
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: onprem-monitoring}
---
# remote_write target (Module 5.1 Step 3 reads this secret)
apiVersion: v1
kind: Secret
metadata:
  name: amp-remote-write
  namespace: onprem-monitoring
type: Opaque
stringData:
  url: "${AMP_REMOTE_WRITE_URL}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: onprem-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # -- your data center's view of the cloud: can the DC reach the control plane?
      - job_name: 'blackbox-cloud-reachability'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - ${EKS_ENDPOINT}
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: blackbox-exporter:9115}

      # -- per-cloud-node reachability, measured from on-prem (ICMP)
      - job_name: 'cloud-nodes'
        metrics_path: /probe
        params:
          module: [icmp]
        static_configs:
          - targets:
${CLOUD_NODE_TARGETS}
            labels: {group: cloud-nodes}
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: blackbox-exporter:9115}

      # -- hybrid node health (node-exporter on hostPort 9100)
      - job_name: 'hybrid-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_eks_amazonaws_com_compute_type]
            regex: hybrid
            action: keep
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__address__]
            regex: '(.*):.*'
            replacement: '${1}:9100'
            target_label: __address__

      # -- annotated pods (the inference metrics-proxy). node_type derived from
      #    the node name: hybrid nodes are SSM managed instances (mi-*).
      #    The KEDA query filters on node_type="hybrid" - measuring pressure on
      #    the tier being protected, never on the relief valve.
      - job_name: 'inference-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+)
            target_label: __tmp_port
          - source_labels: [__address__, __tmp_port]
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '${1}:${2}'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_node_name]
            regex: 'mi-.*'
            replacement: hybrid
            target_label: node_type
          - source_labels: [node_type]
            regex: '^$'
            replacement: cloud
            target_label: node_type

      # -- local kube-state-metrics (pods-by-node panel)
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: [kube-state-metrics.onprem-monitoring:8080]

      # -- Karpenter's own metrics (burst activity, module 6)
      - job_name: 'karpenter'
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [kube-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: karpenter
            action: keep
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:8080'
            target_label: __address__

      # -- Hybrid Nodes Gateway (a CLOUD component), through the API server
      #    proxy - see the Role above for why not direct. During a total
      #    disconnection this scrape fails on purpose: the panel going blank
      #    is the dashboard telling you the gateway lives on the cloud side.
      - job_name: 'hybrid-gateway'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [eks-hybrid-nodes-gateway]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "10080"
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_pod_name]
            regex: (.+)
            replacement: /api/v1/namespaces/eks-hybrid-nodes-gateway/pods/${1}:10080/proxy/metrics
            target_label: __metrics_path__

      - job_name: 'prometheus'
        static_configs:
          - targets: [localhost:9090]

    # NO remote_write here, and that is an architectural decision worth
    # understanding (validated the hard way in the v5 e2e 2026-08-06):
    #
    # Writing to Amazon Managed Prometheus requires SigV4, which requires AWS
    # credentials. A pod on a HYBRID node cannot get them from EKS Pod Identity:
    # the eks-pod-identity-agent DaemonSet carries
    #   eks.amazonaws.com/compute-type NotIn [fargate, hybrid, auto]
    # so AWS excludes hybrid nodes BY DESIGN. The webhook still injects
    # AWS_CONTAINER_CREDENTIALS_FULL_URI, so the SDK tries an endpoint nobody
    # serves, then falls back to IMDS - which the simulated data center blocks -
    # and Prometheus hangs on "Loading configuration file" forever.
    #
    # So the archive tier is fed from the CLOUD side instead (module 4.3: the
    # ADOT collector's dual-export pipeline). Local Prometheus stays exactly
    # what it should be: the storm console that owes nothing to AWS.
    # The amp-remote-write Secret above still carries the URL - it is what the
    # cloud-side collector consumes, and page 4.1 has you read it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: onprem-monitoring
  labels: {app: prometheus}
spec:
  replicas: 1
  strategy: {type: Recreate}    # single local volume - never two writers
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute}
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - {containerPort: 9090, name: http}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
          volumeMounts:
            - {name: cfg, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: cfg
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}    # lab-grade: node-local, survives container restarts (not pod rescheduling)
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: onprem-monitoring
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
# Headless twin of the Service above, for CLOUD-side consumers (KEDA).
# A ClusterIP whose only endpoints live on hybrid nodes is unreachable from
# cloud pods (same class as inference-headless - the service dataplane does
# not span the VXLAN path, direct pod IPs do). Headless resolves straight to
# the pod IP, which the Hybrid Nodes Gateway routes fine. Field-proven on the
# 2026-08-29 validation run: ClusterIP timed out, pod IP answered in 7ms.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-headless
  namespace: onprem-monitoring
spec:
  clusterIP: None
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
# ------------------------------------------------------------ Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: onprem-monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Local Prometheus
        uid: local-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.onprem-monitoring:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: onprem-monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: workshop
        folder: ''
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: onprem-monitoring
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: hybrid
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute}
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.2.0
          env:
            # Anonymous VIEWER, never Admin: participants only read the storm
            # console, and defense in depth matters even on a private VIP -
            # an anonymous-admin Grafana is exactly what made the accidental
            # public exposure on 2026-08-07 a real finding and not a near miss.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_USERS_VIEWERS_CAN_EDIT, value: "false"}
            # Anonymous Viewer is the ONLY access mode. Grafana's default
            # admin/admin credentials otherwise remain active behind the private
            # VIP and contradict the read-only design (self-paced E2E 2026-09-08).
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            # code-server's Simple Browser is an iframe. Grafana defaults to
            # X-Frame-Options: deny, which rendered this private-VIP dashboard
            # blank while the API and live data were healthy (E2E 2026-09-11).
            - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "true"}
            - {name: GF_SECURITY_COOKIE_SAMESITE, value: disabled}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/hybrid-nodes.json}
          ports:
            - {containerPort: 3000, name: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasource
          configMap: {name: grafana-datasource}
        - name: provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboard-hybrid-nodes}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-lb
  namespace: onprem-monitoring
  labels: {app: grafana}
  annotations:
    metallb.io/loadBalancerIPs: 10.80.1.241
    # CRITICAL in a hybrid EKS cluster. Without this annotation the in-tree AWS
    # cloud provider also claims the Service and creates an INTERNET-FACING
    # Classic Load Balancer for it - defeating the disconnection-proof design and
    # publishing the workload to the internet (observed during testing on
    # 2026-08-07). Setting the type to "external" makes the in-tree provider
    # skip the Service; the AWS Load Balancer Controller is not installed in this
    # cluster, so nothing in AWS picks it up and MetalLB owns it alone.
    # NOTE: do NOT use spec.loadBalancerClass for this - MetalLB ignores classed
    # Services unless its controller is started with a matching --lb-class, so
    # the address just stays <pending> (verified 2026-08-07).
    service.beta.kubernetes.io/aws-load-balancer-type: external
spec:
  type: LoadBalancer
  # Keep the local storm console routable while EKS marks disconnected hybrid
  # nodes NotReady. Cluster policy removes those endpoints from kube-proxy and
  # makes this VIP die during the exact total-isolation exercise on page 5.4.
  externalTrafficPolicy: Local
  selector: {app: grafana}
  ports:
    - {name: http, port: 80, targetPort: 3000}
---
# The storm console dashboard, pre-provisioned (page 4.2 also teaches the
# manual Import flow using the standalone copy in ~/workshop/dashboards/).
# DASHBOARD_JSON is replaced at provisioning by the asset install step with
# the indented content of dashboards/hybrid-nodes.json - single source of truth.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hybrid-nodes
  namespace: onprem-monitoring
data:
  hybrid-nodes.json: |
${DASHBOARD_JSON}
